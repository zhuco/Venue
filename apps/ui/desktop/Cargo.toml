[package]
name = "venueflow"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "venueflow"
path = "src/main.rs"
required-features = ["native"]

[features]
default = ["native"]
native = []
web = []
preview = []

[dependencies]
zeroize.workspace = true
futures-util.workspace = true
crossbeam-channel = "0.5"
eframe = { version = "=0.36.1", default-features = false, features = ["default_fonts", "persistence", "wgpu"] }
egui = { version = "=0.36.1", features = ["serde"] }
egui_tiles = { version = "=0.17.1", features = ["serde"] }
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time = { version = "0.3.55", default-features = false, features = ["std", "local-offset", "wasm-bindgen"] }
venue-control-protocol = { path = "../../../crates/venue-control-protocol" }
venue-domain = { path = "../../../crates/venue-domain" }
venue-indicators = { path = "../../../crates/venue-indicators" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64.workspace = true
eframe = { version = "=0.36.1", default-features = false, features = ["default_fonts", "persistence", "wayland", "wgpu", "x11"] }
reqwest = { workspace = true, features = ["stream"] }
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing = "0.1"
tracing-subscriber = "0.3"
venue-gateway-api = { path = "../../../crates/venue-gateway-api" }
venue-gateway-binance = { path = "../../../crates/venue-gateway-binance" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "ErrorEvent", "Event", "EventSource", "HtmlCanvasElement", "Location", "MessageEvent", "Window"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
