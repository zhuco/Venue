[package]
name = "venueflow"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "venueflow"
path = "src/main.rs"
required-features = ["native"]

[features]
default = ["native"]
native = []
web = []
preview = []

[dependencies]
crossbeam-channel = "0.5"
eframe = { version = "=0.36.1", default-features = false, features = ["default_fonts", "persistence", "wgpu"] }
egui = { version = "=0.36.1", features = ["serde"] }
egui_tiles = { version = "=0.17.1", features = ["serde"] }
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
venue-control-protocol = { path = "../../crates/venue-control-protocol" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "=0.36.1", default-features = false, features = ["default_fonts", "persistence", "wayland", "wgpu", "x11"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "ErrorEvent", "Event", "EventSource", "HtmlCanvasElement", "MessageEvent", "Window"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
