[package]
name = "venue-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
venue-domain = { path = "../venue-domain" }

[dev-dependencies]
rust_decimal = { version = "1", features = ["serde", "serde-with-str"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
