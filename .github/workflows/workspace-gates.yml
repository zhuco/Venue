name: workspace-gates

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Configure runner-local Cargo target
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$($env:RUNNER_TEMP)/venue-target"
      - name: Verify repository policy
        shell: pwsh
        run: ./scripts/verify_workspace_policy.ps1
      - name: Verify repository hygiene
        shell: pwsh
        run: ./scripts/verify_repository_hygiene.ps1
      - name: Verify fixed Node release contract
        shell: pwsh
        run: ./scripts/verify_venue_node_linux_release.ps1
      - name: Verify Linux release orchestration with fake tools
        shell: pwsh
        run: ./scripts/test_venue_node_linux_release.ps1
      - name: Verify isolated venue node binaries
        shell: pwsh
        run: ./scripts/verify_venue_node_binaries.ps1
      - name: Verify gateway candidate contract
        shell: pwsh
        run: ./scripts/verify_gateway_candidate_contract.ps1
      - name: Verify VenueFlow Web build
        shell: pwsh
        run: cargo check -p venueflow --target wasm32-unknown-unknown --no-default-features --features web --lib --locked
      - name: Verify Rust workspace quality
        shell: pwsh
        run: ./scripts/verify_workspace_quality.ps1

  web:
    name: Responsive Web gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/venue-web
    env:
      VENUE_WEB_QA_DIR: ${{ runner.temp }}/venue-web-qa/results
      VENUE_WEB_SCREENSHOT_DIR: ${{ runner.temp }}/venue-web-qa/screenshots
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/venue-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify:boundary
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=1

  postgres-integration:
    name: PostgreSQL integration gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: venue_ci
          POSTGRES_USER: venue_ci
          POSTGRES_PASSWORD: venue_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U venue_ci -d venue_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VENUE_CONTROL_POSTGRES_REQUIRED: "1"
      VENUE_CONTROL_TEST_DATABASE_URL: postgresql://venue_ci:venue_ci@127.0.0.1:5432/venue_ci
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Configure runner-local Cargo target
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$($env:RUNNER_TEMP)/venue-target"
      - name: Run mandatory PostgreSQL integration tests
        shell: pwsh
        run: ./scripts/verify_postgres_integration.ps1
